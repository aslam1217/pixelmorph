<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>AI Document Scanner</title>

<link rel="stylesheet" href="style.css">

<!-- OpenCV -->
<script async
src="https://docs.opencv.org/4.x/opencv.js">
</script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>

<h1>

📄 AI Document Scanner

</h1>

</header>

<main>

<div class="toolbar">

<label class="btn">

📂 Select Images

<input
type="file"
id="galleryInput"
accept="image/*"
multiple
hidden>

</label>

<button
id="cameraBtn"
class="btn">

📷 Camera

</button>

<button
id="clearBtn"
class="btn danger">

🗑 Clear

</button>

<button
id="pdfBtn"
class="btn success">

📄 Download PDF

</button>

</div>

<section
id="cameraSection"
class="hidden">

<video
id="video"
autoplay
playsinline>

</video>

<div class="cameraButtons">

<button
id="captureBtn">

Capture

</button>

<button
id="closeCamera">

Close

</button>

</div>

</section>

<section id="pages">

</section>

</main>

<script src="utils.js"></script>

<script src="scanner.js"></script>

<script src="camera.js"></script>

<script src="pdf.js"></script>

<script src="app.js"></script>

</body>

</html>
