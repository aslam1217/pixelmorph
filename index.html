<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document Scanner</title>

    <link rel="stylesheet" href="style.css">

    <!-- OpenCV -->
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

</head>

<body>

<div class="container">

    <h1>📄 Document Scanner</h1>

    <p class="subtitle">
        Upload one or more images and automatically crop documents.
    </p>

    <div class="upload-box">

        <input
            type="file"
            id="upload"
            accept="image/*"
            multiple>

    </div>

    <div class="buttons">

        <button id="clearBtn">
            🗑 Clear All
        </button>

        <button id="downloadBtn">
            ⬇ Download Images
        </button>

    </div>

    <h2>Scanned Pages</h2>

    <div id="results"></div>

</div>

<script src="script.js"></script>

</body>

</html>
